# Baut DMX Bridge für Windows, macOS (Universal: Intel + Apple Silicon) und Linux.
#
# Auslöser:
#   - Push auf main          → Builds als Download unter "Actions" → Lauf → "Artifacts"
#   - Tag v* (z. B. v0.3.0)   → zusätzlich GitHub-Release mit allen ZIPs
#                               (v0.3.0-alpha / -beta / -rc → Vorabversion)
#   - manuell                 → Actions → "Build" → "Run workflow"
#                               Feld "Release-Tag" ausfüllen (z. B. v0.3.0-alpha)
#                               → Tag + Release werden automatisch angelegt

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release-Tag (leer = nur bauen), z. B. v0.3.0-alpha"
        required: false
        default: ""

permissions:
  contents: write   # nötig, um Releases anzulegen

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            cmd: cargo xtask bundle dmx_bridge --release
          - name: macos-universal
            os: macos-latest
            cmd: cargo xtask bundle-universal dmx_bridge --release
          - name: linux
            os: ubuntu-22.04
            cmd: cargo xtask bundle dmx_bridge --release

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Bauen
        run: ${{ matrix.cmd }}

      - name: ZIP packen
        shell: bash
        run: |
          # Lizenzhinweise für die eingebettete QLC+-Fixture-Bibliothek mitliefern
          cp LICENSE target/bundled/LICENSE.txt
          cp library/QLCPLUS-LICENSE.txt target/bundled/
          cp assets/fonts/SpaceGrotesk-OFL.txt target/bundled/
          printf 'Die eingebettete Fixture-Bibliothek stammt aus QLC+ (https://www.qlcplus.org),\nLizenz: Apache License 2.0 (siehe QLCPLUS-LICENSE.txt).\n' > target/bundled/HINWEIS-QLCPLUS.txt
          cd target/bundled
          ZIP="DMX-Bridge-${{ matrix.name }}.zip"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../../$ZIP" ./*
          else
            zip -r -y "../../$ZIP" ./*
          fi

      - name: Als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DMX-Bridge-${{ matrix.name }}
          path: DMX-Bridge-${{ matrix.name }}.zip

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    env:
      TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Builds holen
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Repo-Adresse in die Release-Notizen einsetzen
        run: sed -i "s#REPO_URL#${{ github.server_url }}/${{ github.repository }}#g" .github/release-notes.md

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: DMX Bridge ${{ env.TAG }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          # alpha/beta/rc im Tag-Namen → als Vorabversion markieren
          prerelease: ${{ contains(env.TAG, 'alpha') || contains(env.TAG, 'beta') || contains(env.TAG, 'rc') }}
          files: dist/*.zip
