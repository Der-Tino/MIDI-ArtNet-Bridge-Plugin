[package]
name = "dmx_bridge"
version = "0.4.2"
edition = "2021"
description = "MIDI notes → DMX over Art-Net, as a CLAP/VST3 plugin"
license = "GPL-3.0-or-later"
repository = "https://github.com/Der-Tino/MIDI-ArtNet-Bridge-Plugin"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
# Kopie mit öffentlicher set_requested_size() – siehe vendor/nih_plug_egui/VENDORED.md
nih_plug_egui = { path = "vendor/nih_plug_egui" }

[profile.release]
lto = "thin"
strip = "symbols"
